# Application HTTP Port
quarkus.http.port=8082

# Configure PostgreSQL database (connection details will be provided by Testcontainers)
quarkus.datasource."a2a-java".db-kind=postgresql
quarkus.datasource."a2a-java".jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/a2adb}
quarkus.datasource."a2a-java".username=${DATABASE_USER:a2auser}
quarkus.datasource."a2a-java".password=${DATABASE_PASSWORD:a2apass}
quarkus.hibernate-orm."a2a-java".datasource=a2a-java
quarkus.hibernate-orm."a2a-java".database.generation=${A2A_SCHEMA_GENERATION:drop-and-create}
quarkus.hibernate-orm."a2a-java".packages=org.a2aproject.sdk.extras.taskstore.database.jpa,org.a2aproject.sdk.extras.pushnotificationconfigstore.database.jpa

# Configure the outgoing channel (QueueManager -> Kafka)
mp.messaging.outgoing.replicated-events-out.connector=smallrye-kafka
mp.messaging.outgoing.replicated-events-out.topic=replicated-events
mp.messaging.outgoing.replicated-events-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.replicated-events-out.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Configure the incoming channel (Kafka -> QueueManager)
mp.messaging.incoming.replicated-events-in.connector=smallrye-kafka
mp.messaging.incoming.replicated-events-in.topic=replicated-events
mp.messaging.incoming.replicated-events-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.replicated-events-in.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.replicated-events-in.group.id=app-2-consumer-group
mp.messaging.incoming.replicated-events-in.auto.offset.reset=earliest
mp.messaging.incoming.replicated-events-in.session.timeout.ms=${KAFKA_SESSION_TIMEOUT_MS:45000}
mp.messaging.incoming.replicated-events-in.heartbeat.interval.ms=${KAFKA_HEARTBEAT_MS:3000}

# Disable DevServices - Testcontainers will manage infrastructure
quarkus.devservices.enabled=false
quarkus.kafka.devservices.enabled=false

# Reduce timeouts for faster tests
quarkus.messaging.kafka.health.timeout=5s

# Enable debug logging
quarkus.log.category."org.a2aproject.sdk.server.events".level=DEBUG
quarkus.log.category."org.a2aproject.sdk.server.requesthandlers".level=DEBUG
quarkus.log.category."org.a2aproject.sdk.server.tasks".level=DEBUG
quarkus.log.category."org.a2aproject.sdk.extras.queuemanager.replicated".level=DEBUG
quarkus.log.category."org.a2aproject.sdk.extras.taskstore.database.jpa".level=DEBUG
quarkus.log.category."org.a2aproject.sdk.client".level=DEBUG

# Authorization is not configured in test profiles
a2a.authorization.required=false

# Phase 3 authority profile (A2A 1.1). Everything below is inert unless the test sets the environment variables, so the
# legacy MultiInstanceReplicationTest keeps running the unchanged legacy-only profile.
a2a.test.node-id=app2
a2a.task-store.writer-epoch=${A2A_WRITER_EPOCH:}
a2a.test.bootstrap-epoch=${A2A_BOOTSTRAP_EPOCH:false}
# Webhook receivers in the test run on the host/another container: allow plain HTTP and private targets (test only)
a2a.push-notification.url.allowed-schemes=http,https
a2a.push-notification.url.allow-private-network-targets=true
# Broker identity of this fleet. The defaults keep the legacy unauthenticated PLAINTEXT test unchanged; the Phase 3 test
# sets the environment variables to run against a SASL/ACL broker with a distinct principal for this fleet.
mp.messaging.connector.smallrye-kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
mp.messaging.connector.smallrye-kafka.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
mp.messaging.connector.smallrye-kafka.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:org.apache.kafka.common.security.plain.PlainLoginModule required;}
